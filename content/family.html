<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Tree</title>
    <link href="../assets/css/family.css" rel="stylesheet" />
  </head>

  <body>
    <header>
      <a href="start.html">Back to Start</a>
    </header>
    <main>
      <h1>Family Tree</h1>
      <!--
Source - https://stackoverflow.com/q/53151296
Posted by Thomas, modified by community. See post 'Timeline' for change history
Retrieved 2026-11-05, License - CC BY-SA 4.0
-->

      <div class="tree">
        <ul>
          <li>
            <div class="family">
              <div class="person child male">
                <div class="name">Papi</div>
              </div>
              <div class="parent">
                <div class="person female">
                  <div class="name">Grandma</div>
                </div>
                <ul>
                  <li>
                    <div class="family" style="width: 172px">
                      <div class="person child female">
                        <div class="name">Aunt Kelly</div>
                      </div>
                    </div>
                  </li>
                  <li>
                    <div class="family" style="width: 172px">
                      <div class="person child female">
                        <div class="name">Aunt Kim</div>
                      </div>
                      <div class="parent">
                        <div class="person male">
                          <div class="name">Blaine</div>
                        </div>
                      </div>
                    </div>
                  </li>
                  <li>
                    <div class="family" style="width: 344px">
                      <div class="person child female">
                        <div class="name">Mother</div>
                      </div>
                      <div class="parent">
                        <div class="person male">
                          <div class="name">Biological Father</div>
                        </div>
                        <ul>
                          <li>
                            <div class="person child male">
                              <div class="name">Ethan</div>
                            </div>
                          </li>
                          <li>
                            <div class="person child female">
                              <div class="name">Me</div>
                            </div>
                          </li>
                        </ul>
                      </div>
                      <div class="person spouse male">
                        <div class="name">Stepfather</div>
                      </div>
                    </div>
                  </li>
                </ul>
              </div>
            </div>
          </li>
        </ul>
      </div>
    </main>
  </body>
</html>
